<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <!-- House body -->
  <rect x="126" y="248" width="260" height="196" rx="8" fill="white" opacity="0.95"/>
  <!-- Roof -->
  <polygon points="256,88 406,252 106,252" fill="white" opacity="0.95"/>
  <!-- Roof peak accent -->
  <polygon points="256,88 406,252 106,252" fill="none" stroke="white" stroke-width="0" opacity="0"/>
  <!-- Door -->
  <rect x="211" y="330" width="90" height="114" rx="10" fill="#16a34a"/>
  <!-- Door knob -->
  <circle cx="291" cy="393" r="7" fill="white" opacity="0.8"/>
  <!-- Window left -->
  <rect x="145" y="278" width="68" height="58" rx="8" fill="#16a34a" opacity="0.85"/>
  <line x1="179" y1="278" x2="179" y2="336" stroke="white" stroke-width="3" opacity="0.5"/>
  <line x1="145" y1="307" x2="213" y2="307" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Window right -->
  <rect x="299" y="278" width="68" height="58" rx="8" fill="#16a34a" opacity="0.85"/>
  <line x1="333" y1="278" x2="333" y2="336" stroke="white" stroke-width="3" opacity="0.5"/>
  <line x1="299" y1="307" x2="367" y2="307" stroke="white" stroke-width="3" opacity="0.5"/>
  <!-- Star accent on roof -->
  <circle cx="256" cy="62" r="18" fill="#fbbf24"/>
  <text x="256" y="70" font-size="20" text-anchor="middle" fill="white" font-family="system-ui" font-weight="bold">★</text>
</svg>
