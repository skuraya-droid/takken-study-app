//  忘却曲線 (SM-2ベース)
// ═══════════════════════════════════════
const DEFAULT_EASE = 2.5;
const MIN_EASE = 1.3;

function todayStr() {
  return new Date().toISOString().split('T')[0];
}
function addDays(dateStr, days) {
  const d = new Date(dateStr + 'T00:00:00');
  d.setDate(d.getDate() + days);
  return d.toISOString().split('T')[0];
}
function calcNextReview(prev, correct) {
  let interval = prev ? prev.interval : 0;
  let reps     = prev ? prev.repetitions : 0;
  let ease     = prev ? prev.easeFactor : DEFAULT_EASE;
  const total  = (prev ? prev.totalAttempts : 0) + 1;
  const corrCt = (prev ? prev.correctAttempts : 0) + (correct ? 1 : 0);

  if (correct) {
    if (reps === 0)      interval = 1;
    else if (reps === 1) interval = 3;
    else                 interval = Math.round(interval * ease);
    reps++;
    ease = Math.min(3.0, ease + 0.1);
  } else {
    interval = 1;
    reps = 0;
    ease = Math.max(MIN_EASE, ease - 0.2);
  }
  return {
    interval, repetitions: reps, easeFactor: ease,
    nextReview: addDays(todayStr(), interval),
    lastReview: todayStr(),
    totalAttempts: total,
    correctAttempts: corrCt,
  };
}

async function requestNotif() {
  if (!('Notification' in window)) return false;
  const p = await Notification.requestPermission();
  return p === 'granted';
}
function sendNotif(title, body) {
  if (Notification?.permission === 'granted') {
    try { new Notification(title, { body, icon: '📚' }); } catch(_){}
  }
}

function ProgressRing({ pct, size = 56, stroke = 5, color = '#16a34a' }) {
  const r = (size - stroke) / 2;
  const circ = 2 * Math.PI * r;
  const offset = circ * (1 - pct / 100);
  return (
    <svg width={size} height={size}>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e5e7eb" strokeWidth={stroke}/>
      <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke}
        strokeDasharray={circ} strokeDashoffset={offset}
        strokeLinecap="round"
        style={{transform:'rotate(-90deg)', transformOrigin:'center', transition:'stroke-dashoffset 0.5s ease'}}/>
    </svg>
  );
}

      </div>
    </div>
  );
}

const OPT_LABELS = ['1', '2', '3', '4'];

function StudyView({ question, qNum, qTotal, showResult, selected, onAnswer, onNext, onExit }) {
  const correct = question.ans;
  return (
    <div className="min-h-screen flex flex-col">
      {/* ヘッダー */}
      <div className="bg-white px-4 pt-10 pb-3 shadow-sm">
        <div className="flex items-center gap-3 mb-3">
          <button onClick={onExit} className="text-gray-400 text-lg">←</button>
          <div className="flex-1">
            <div className="flex justify-between text-xs text-gray-400 mb-1">
              <span>{qNum} / {qTotal}</span>
              <span>{Math.round(qNum/qTotal*100)}%</span>
            </div>
            <div className="h-2 bg-gray-100 rounded-full overflow-hidden">
              <div
                className="h-full bg-green-500 rounded-full progress-bar-inner"
                style={{ width: `${qNum/qTotal*100}%` }}
              />
            </div>
          </div>
        </div>
      </div>

      {/* 問題 */}
      <div className="flex-1 overflow-y-auto px-4 py-4">
        <div className="card p-4 mb-4 fade-in">
          <div className="flex gap-2 mb-3">
            <Badge cat={question.category} />
            <span className="text-xs text-gray-400 self-center">{question.sub}</span>
          </div>
          <p className="text-sm text-gray-800 leading-relaxed">{question.q}</p>
        </div>

        {/* 選択肢 */}
        <div className="space-y-2">
          {question.opts.map((opt, i) => {
            let cls = 'btn-opt w-full text-left p-3.5 rounded-xl border-2 text-sm leading-snug ';
            if (!showResult) {
              cls += 'bg-white border-gray-200 text-gray-700 active:border-green-400';
            } else if (i === correct) {
              cls += 'bg-green-50 border-green-400 text-green-800';
            } else if (i === selected && selected !== correct) {
              cls += 'bg-red-50 border-red-300 text-red-700';
            } else {
              cls += 'bg-white border-gray-100 text-gray-400';
            }
            return (
              <button key={i} onClick={() => !showResult && onAnswer(i)} className={cls}>
                <span className="font-bold mr-2">
                  {showResult && i === correct ? '✓' : showResult && i === selected && selected !== correct ? '✗' : OPT_LABELS[i] + '.'}
                </span>
                {opt}
              </button>
            );
          })}
        </div>

        {/* 解説 */}
        {showResult && (
          <div className="mt-4 card p-4 slide-up">
            <div className="flex items-center gap-2 mb-2">
              <span className="text-lg">{selected === correct ? '🎉' : '📖'}</span>
              <span className={`font-bold text-sm ${selected === correct ? 'text-green-700' : 'text-red-600'}`}>
                {selected === correct ? '正解！' : '不正解'}
              </span>
            </div>
            <p className="text-sm text-gray-700 leading-relaxed">{question.exp}</p>
          </div>
        )}
        <div className="h-20"/>
      </div>

      {/* 次へボタン */}
      {showResult && (
        <div className="fixed bottom-0 left-0 right-0 px-4 pb-8 pt-3 bg-gradient-to-t from-gray-50 to-transparent">
          <button
            onClick={onNext}
            className="w-full py-3.5 bg-green-600 text-white rounded-xl font-bold text-base shadow-lg shadow-green-200 active:bg-green-700"
          >
            次の問題へ →
          </button>
        </div>
      )}
    </div>
  );
}

//  Complete View
// ═══════════════════════════════════════
function CompleteView({ results, questions, onHome, onReview }) {
  const correct = results.filter(r => r.correct).length;
  const total = results.length;
  const pct = total > 0 ? Math.round(correct/total*100) : 0;
  const wrong = results.filter(r => !r.correct);
  const [showWrong, setShowWrong] = useState(false);

  return (
    <div className="min-h-screen px-4 pt-12 pb-8">
      <div className="text-center mb-6 slide-up">
        <div className="text-5xl mb-3">{pct >= 80 ? '🎊' : pct >= 60 ? '👍' : '💪'}</div>
        <h2 className="text-2xl font-bold text-gray-800">セッション完了</h2>
        <p className="text-gray-500 text-sm mt-1">{total}問 チャレンジしました</p>
      </div>

      <div className="card p-5 mb-4 slide-up">
        <div className="flex items-center justify-center mb-4">
          <div className="relative">
            <ProgressRing pct={pct} size={100} stroke={8} color={pct>=80?'#16a34a':pct>=60?'#f59e0b':'#ef4444'} />
            <div className="absolute inset-0 flex items-center justify-center">
              <span className="text-2xl font-bold text-gray-700">{pct}%</span>
            </div>
          </div>
        </div>
        <div className="grid grid-cols-3 gap-3 text-center">
          <div className="bg-green-50 rounded-xl p-3">
            <div className="text-xl font-bold text-green-700">{correct}</div>
            <div className="text-xs text-gray-500">正解</div>
          </div>
          <div className="bg-red-50 rounded-xl p-3">
            <div className="text-xl font-bold text-red-500">{total - correct}</div>
            <div className="text-xs text-gray-500">不正解</div>
          </div>
          <div className="bg-gray-50 rounded-xl p-3">
            <div className="text-xl font-bold text-gray-700">{total}</div>
            <div className="text-xs text-gray-500">合計</div>
          </div>
        </div>
      </div>

      {wrong.length > 0 && (
        <div className="card mb-4 fade-in overflow-hidden">
          <button
            onClick={() => setShowWrong(v=>!v)}
            className="w-full p-4 flex justify-between items-center text-left"
          >
            <span className="font-bold text-gray-800">間違えた問題 ({wrong.length}問)</span>
            <span className="text-gray-400">{showWrong ? '▲' : '▼'}</span>
          </button>
          {showWrong && (
            <div className="px-4 pb-4 space-y-3">
              {wrong.map(r => {
                const q = questions.find(q => q.id === r.questionId);
                return q ? (
                  <div key={q.id} className="border border-gray-100 rounded-xl p-3">
                    <div className="flex gap-2 mb-1"><Badge cat={q.category}/></div>
                    <p className="text-xs text-gray-700 mb-2 leading-relaxed">{q.q}</p>
                    <p className="text-xs text-green-700 font-medium">✓ {q.opts[q.ans]}</p>
                  </div>
                ) : null;
              })}
            </div>
          )}
        </div>
      )}

      <button
        onClick={onHome}
        className="w-full py-3.5 bg-green-600 text-white rounded-xl font-bold text-base shadow-lg shadow-green-200"
      >
        ホームへ戻る
      </button>
    </div>
  );
}

// ═══════════════════════════════════════
//  Stats View
// ═══════════════════════════════════════
function StatsView({ progress, sessions, onBack }) {
  const totalQ = QUESTIONS.length;
  const studied  = Object.keys(progress).length;
  const mastered = Object.values(progress).filter(p => p.repetitions >= 4).length;
  const allCorrect = Object.values(progress).reduce((a, p) => a + (p.correctAttempts||0), 0);
  const allTotal   = Object.values(progress).reduce((a, p) => a + (p.totalAttempts||0), 0);
  const accuracy = allTotal > 0 ? Math.round(allCorrect/allTotal*100) : 0;
  const totalTime = sessions.reduce((a, s) => a + (s.timeSpent||0), 0);
  const fmtTime = (sec) => {
    const h = Math.floor(sec/3600);
    const m = Math.floor((sec%3600)/60);
    return h > 0 ? `${h}時間${m}分` : `${m}分`;
  };

  // 直近30日カレンダー
  const last30 = Array.from({length:30}, (_, i) => {
    const d = addDays(todayStr(), -29 + i);
    const ss = sessions.filter(s => s.date === d);
    return { d, count: ss.reduce((a,s)=>a+s.questionsAnswered,0) };
  });
  const maxDay = Math.max(...last30.map(d => d.count), 1);

  // カテゴリ別詳細
  const catDetail = CATEGORIES.map(cat => {
    const qs = QUESTIONS.filter(q => q.category === cat);
    const done = qs.filter(q => progress[q.id]);
    const corr = done.reduce((a, q) => a + (progress[q.id]?.correctAttempts||0), 0);
    const tot  = done.reduce((a, q) => a + (progress[q.id]?.totalAttempts||0), 0);
    return {
      cat,
      total: qs.length,
      done: done.length,
      accuracy: tot > 0 ? Math.round(corr/tot*100) : 0,
    };
  });

  // 次の復習予定
  const upcoming = QUESTIONS
    .filter(q => progress[q.id]?.nextReview)
    .sort((a,b) => progress[a.id].nextReview.localeCompare(progress[b.id].nextReview))
    .slice(0,5)
    .map(q => ({ q, next: progress[q.id].nextReview }));

  return (
    <div className="min-h-screen pb-8">
      <div className="bg-green-600 text-white px-4 pt-10 pb-5">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-white/80">← 戻る</button>
          <h2 className="font-bold text-lg">学習統計</h2>
        </div>
      </div>

      <div className="px-4 pt-4 space-y-4">
        {/* 総合サマリ */}
        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-3">総合成績</h3>
          <div className="grid grid-cols-2 gap-3">
            {[
              { label:'学習問題', val:`${studied}/${totalQ}問`, sub:`${Math.round(studied/totalQ*100)}%完了` },
              { label:'習得済み', val:`${mastered}問`, sub:'4回以上正解' },
              { label:'全体正解率', val:`${accuracy}%`, sub:`${allTotal}回解答` },
              { label:'累計学習時間', val:fmtTime(totalTime), sub:`${sessions.length}セッション` },
            ].map(({label,val,sub}) => (
              <div key={label} className="bg-gray-50 rounded-xl p-3">
                <div className="text-xs text-gray-400 mb-0.5">{label}</div>
                <div className="text-lg font-bold text-gray-700">{val}</div>
                <div className="text-xs text-gray-400">{sub}</div>
              </div>
            ))}
          </div>
        </div>

        {/* 30日カレンダー */}
        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-3">学習カレンダー（30日）</h3>
          <div className="grid grid-cols-10 gap-1">
            {last30.map(({ d, count }) => (
              <div
                key={d}
                title={`${d}: ${count}問`}
                className="aspect-square rounded"
                style={{
                  background: count === 0 ? '#e5e7eb' :
                    count < maxDay * 0.3 ? '#bbf7d0' :
                    count < maxDay * 0.7 ? '#4ade80' : '#16a34a'
                }}
              />
            ))}
          </div>
          <div className="flex items-center gap-2 mt-2 justify-end">
            <span className="text-xs text-gray-400">少</span>
            {['#e5e7eb','#bbf7d0','#4ade80','#16a34a'].map(c => (
              <div key={c} className="w-3 h-3 rounded" style={{background:c}}/>
            ))}
            <span className="text-xs text-gray-400">多</span>
          </div>
        </div>

        {/* カテゴリ別 */}
        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-3">カテゴリ別成績</h3>
          <div className="space-y-3">
            {catDetail.map(({ cat, total, done, accuracy: acc }) => {
              const c = CAT_COLORS[cat];
              return (
                <div key={cat}>
                  <div className="flex justify-between items-center mb-1">
                    <span className={`text-sm font-medium ${c.text}`}>{cat}</span>
                    <div className="flex gap-3 text-xs text-gray-500">
                      <span>{done}/{total}問</span>
                      <span className="font-medium">{acc}%</span>
                    </div>
                  </div>
                  <div className="h-2.5 bg-gray-100 rounded-full overflow-hidden">
                    <div
                      className="h-full rounded-full progress-bar-inner"
                      style={{ width:`${total>0?Math.round(done/total*100):0}%`, background: c.dot }}
                    />
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        {/* 次の復習 */}
        {upcoming.length > 0 && (
          <div className="card p-4 fade-in">
            <h3 className="font-bold text-gray-800 mb-3">次の復習予定</h3>
            <div className="space-y-2">
              {upcoming.map(({ q, next }) => {
                const isToday = next === todayStr();
                const isTomorrow = next === addDays(todayStr(), 1);
                const label = isToday ? '今日' : isTomorrow ? '明日' : next;
                return (
                  <div key={q.id} className="flex justify-between items-center py-2 border-b border-gray-50 last:border-0">
                    <div className="flex-1 min-w-0">
                      <Badge cat={q.category}/>
                      <p className="text-xs text-gray-600 mt-0.5 truncate">{q.q.slice(0,40)}…</p>
                    </div>
                    <span className={`text-xs font-medium ml-2 shrink-0 ${isToday ? 'text-red-500' : 'text-gray-400'}`}>
                      {label}
                    </span>
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>
    </div>
  );
}

//  Settings View

function SettingsView({ settings, onUpdate, onBack, onReset }) {
  const [notifGranted, setNotifGranted] = useState(Notification?.permission === 'granted');

  const handleNotifToggle = async () => {
    if (!settings.notificationsEnabled) {
      const ok = await requestNotif();
      setNotifGranted(ok);
      if (ok) {
        onUpdate({ notificationsEnabled: true });
        sendNotif('宅建マスター', '通知を有効にしました！毎日の学習継続を応援します📚');
      }
    } else {
      onUpdate({ notificationsEnabled: false });
    }
  };

  const toggleCat = (cat) => {
    const cats = settings.categories.includes(cat)
      ? settings.categories.filter(c => c !== cat)
      : [...settings.categories, cat];
    if (cats.length > 0) onUpdate({ categories: cats });
  };

  return (
    <div className="min-h-screen pb-8">
      <div className="bg-green-600 text-white px-4 pt-10 pb-5">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="text-white/80">← 戻る</button>
          <h2 className="font-bold text-lg">設定</h2>
        </div>
      </div>

      <div className="px-4 pt-4 space-y-4">
        {/* 通知設定 */}
        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-1">🔔 通知（忘却曲線リマインダー）</h3>
          <p className="text-xs text-gray-400 mb-3">アプリを開いた際に、復習が必要な問題をお知らせします</p>
          <div className="flex items-center justify-between">
            <div>
              <p className="text-sm text-gray-700">学習リマインダー</p>
              {!notifGranted && settings.notificationsEnabled === false && (
                <p className="text-xs text-orange-500 mt-0.5">ブラウザの許可が必要です</p>
              )}
            </div>
            <button
              onClick={handleNotifToggle}
              className={`relative w-12 h-6 rounded-full transition-colors ${
                settings.notificationsEnabled ? 'bg-green-500' : 'bg-gray-200'
              }`}
            >
              <div className={`absolute top-1 w-4 h-4 bg-white rounded-full shadow transition-transform ${
                settings.notificationsEnabled ? 'translate-x-7' : 'translate-x-1'
              }`}/>
            </button>
          </div>
        </div>

        {/* 1日の新規問題数 */}
        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-3">📚 1日の新規問題数</h3>
          <div className="flex items-center gap-4">
            <input
              type="range" min="1" max="20" step="1"
              value={settings.newPerDay}
              onChange={e => onUpdate({ newPerDay: Number(e.target.value) })}
              className="flex-1 accent-green-600"
            />
            <span className="text-lg font-bold text-green-700 w-10 text-right">
              {settings.newPerDay}問
            </span>
          </div>
          <p className="text-xs text-gray-400 mt-1">復習問題は別途すべて表示されます</p>
        </div>

        {/* カテゴリ選択 */}
        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-3">📂 学習カテゴリ</h3>
          <div className="space-y-2">
            {CATEGORIES.map(cat => {
              const enabled = settings.categories.includes(cat);
              const c = CAT_COLORS[cat];
              const qs = QUESTIONS.filter(q => q.category === cat);
              return (
                <button
                  key={cat}
                  onClick={() => toggleCat(cat)}
                  className={`w-full flex items-center justify-between p-3 rounded-xl border-2 transition-all ${
                    enabled ? `${c.bg} ${c.border}` : 'bg-white border-gray-100'

                  <div className="flex items-center gap-2">
                    <div className={`w-2.5 h-2.5 rounded-full`} style={{background: enabled ? c.dot : '#d1d5db'}}/>

                  </div>
                  <span className="text-lg">{enabled ? '✓' : ''}</span>
                </button>
              );

        {/* 忘却曲線の説明 */}

              { rep: '初回正解', interval: '1日後に復習' },
              { rep: '2回目正解', interval: '3日後に復習' },

          <button
            onClick={onReset}
            className="w-full py-2.5 border-2 border-red-200 text-red-500 rounded-xl text-sm font-medium active:bg-red-50"
          >
            学習データをリセット
          </button>
        </div>
      </div>
    </div>
  );
}

// ═══════════════════════════════════════
//  Main App
// ═══════════════════════════════════════
function App() {
  const [view, setView] = useState('home');
  const [progress, setProgress] = useState(() => ls_get(LS.progress, {}));
  const [sessions, setSessions] = useState(() => ls_get(LS.sessions, []));
  const [settings, setSettings] = useState(() => ({
    notificationsEnabled: false,
    newPerDay: 10,
    categories: CATEGORIES,
    ...ls_get(LS.settings, {}),
  }));

  // 学習セッション状態
  const [queue, setQueue] = useState([]);
  const [qIdx, setQIdx] = useState(0);
  const [results, setResults] = useState([]);
  const [showResult, setShowResult] = useState(false);
  const [selected, setSelected] = useState(null);
  const [sessStart, setSessStart] = useState(null);

  // 起動時通知チェック
  useEffect(() => {
    if (settings.notificationsEnabled && Notification?.permission === 'granted') {
      const due = QUESTIONS.filter(q =>
        progress[q.id]?.nextReview <= todayStr() &&
        settings.categories.includes(q.category)
      ).length;
      if (due > 0) {
        sendNotif('宅建マスター 📚', `今日の復習問題が${due}問あります。忘れる前に復習しましょう！`);
      }
    }
  }, []);

  const dueQ = useMemo(() =>
    QUESTIONS.filter(q =>
      progress[q.id]?.nextReview <= todayStr() &&
      settings.categories.includes(q.category)
    ), [progress, settings.categories]);

  const newQ = useMemo(() =>
    QUESTIONS.filter(q =>
      !progress[q.id] &&
      settings.categories.includes(q.category)
    ).slice(0, settings.newPerDay), [progress, settings.categories, settings.newPerDay]);

  const startStudy = () => {
    const q = [...dueQ, ...newQ].sort(() => Math.random() - 0.5);
    if (!q.length) return;
    setQueue(q);
    setQIdx(0);
    setResults([]);
    setShowResult(false);
    setSelected(null);
    setSessStart(Date.now());
    setView('study');
  };

  const handleAnswer = (optIdx) => {
    if (showResult) return;
    setSelected(optIdx);
    setShowResult(true);
    const q = queue[qIdx];
    const correct = optIdx === q.ans;
    const newProg = { ...progress, [q.id]: calcNextReview(progress[q.id], correct) };
    setProgress(newProg);
    ls_set(LS.progress, newProg);
    setResults(prev => [...prev, { questionId: q.id, correct }]);
  };

  const handleNext = () => {
    if (qIdx + 1 >= queue.length) {
      const time = Math.round((Date.now() - sessStart) / 1000);
      const newSess = {
        date: todayStr(),
        questionsAnswered: queue.length,
        correctAnswers: results.filter(r => r.correct).length,
        timeSpent: time,
      };
      const updSess = [...sessions, newSess];
      setSessions(updSess);
      ls_set(LS.sessions, updSess);
      setView('complete');
    } else {
      setQIdx(prev => prev + 1);
      setShowResult(false);
      setSelected(null);
    }
  };

  const updateSettings = (upd) => {
    const s = { ...settings, ...upd };
    setSettings(s);
    ls_set(LS.settings, s);
  };

  const handleReset = () => {
    if (confirm('すべての学習データをリセットしますか？この操作は取り消せません。')) {
      setProgress({});
      setSessions([]);
      ls_set(LS.progress, {});
      ls_set(LS.sessions, []);
      setView('home');
    }
  };

  return (
    <div className="max-w-md mx-auto min-h-screen bg-gray-50 relative overflow-x-hidden">
      {view === 'home' && (
        <HomeView
          dueQ={dueQ} newQ={newQ}
          progress={progress} sessions={sessions}
          onStart={startStudy}
          onStats={() => setView('stats')}
          onSettings={() => setView('settings')}
        />
      )}
      {view === 'study' && queue.length > 0 && (
        <StudyView
          question={queue[qIdx]}
          qNum={qIdx + 1} qTotal={queue.length}
          showResult={showResult} selected={selected}
          onAnswer={handleAnswer} onNext={handleNext}
          onExit={() => setView('home')}
        />
      )}
      {view === 'complete' && (
        <CompleteView
          results={results} questions={queue}
          onHome={() => setView('home')}
        />
      )}
      {view === 'stats' && (
        <StatsView
          progress={progress} sessions={sessions}
          onBack={() => setView('home')}
        />
      )}
      {view === 'settings' && (
        <SettingsView
          settings={settings}
          onUpdate={updateSettings}
          onBack={() => setView('home')}
          onReset={handleReset}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
