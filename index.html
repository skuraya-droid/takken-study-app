<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="宅建マスター">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon.svg">
  <title>宅建マスター</title>
  <script src="questions.js"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }
    body { background:#f0fdf4; font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',Meiryo,sans-serif; -webkit-font-smoothing:antialiased; margin:0; }
    .fade-in  { animation: fadeIn  0.25s ease both; }
    .slide-up { animation: slideUp 0.35s ease both; }
    .pop-in   { animation: popIn   0.4s cubic-bezier(0.34,1.56,0.64,1) both; }
    @keyframes fadeIn  { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:none} }
    @keyframes popIn   { from{opacity:0;transform:scale(0.5)} to{opacity:1;transform:scale(1)} }
    @keyframes xpFly   { 0%{opacity:1;transform:translateY(0) scale(1)} 60%{opacity:1;transform:translateY(-44px) scale(1.3)} 100%{opacity:0;transform:translateY(-64px) scale(0.9)} }
    @keyframes lvUp    { 0%{opacity:0;transform:scale(0.4) rotate(-8deg)} 60%{transform:scale(1.1) rotate(2deg);opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes shine   { 0%,100%{filter:brightness(1)} 50%{filter:brightness(1.18)} }
    .xp-fly  { animation: xpFly 0.9s ease forwards; position:absolute; right:12px; top:0; pointer-events:none; }
    .lv-anim { animation: lvUp 0.7s cubic-bezier(0.34,1.56,0.64,1) both; }
    .shine   { animation: shine 2s ease-in-out infinite; }
    .progress-bar { transition: width 0.55s ease; }
    .btn-opt { transition: all 0.13s ease; }
    .btn-opt:active { transform: scale(0.98); }
    ::-webkit-scrollbar { width:4px; }
    ::-webkit-scrollbar-thumb { background:#86efac; border-radius:2px; }
    .card { background:white; border-radius:16px; box-shadow:0 1px 6px rgba(0,0,0,0.07); }
    input[type=range] { accent-color:#16a34a; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useMemo, useCallback } = React;

const CATEGORIES = ['権利関係','宅建業法','法令上の制限','税・その他'];
const CAT_COLORS = {
  '権利関係':    { bg:'bg-blue-50',   text:'text-blue-700',   dot:'#3b82f6', border:'border-blue-200',  grad:'from-blue-600 to-blue-800',   icon:'⚖️' },
  '宅建業法':    { bg:'bg-green-50',  text:'text-green-700',  dot:'#16a34a', border:'border-green-200', grad:'from-green-600 to-green-800',  icon:'🏢' },
  '法令上の制限':{ bg:'bg-orange-50', text:'text-orange-700', dot:'#f97316', border:'border-orange-200',grad:'from-orange-500 to-orange-700', icon:'🗺️' },
  '税・その他':  { bg:'bg-purple-50', text:'text-purple-700', dot:'#9333ea', border:'border-purple-200',grad:'from-purple-600 to-purple-800', icon:'💰' },
};
const CAT_SUBS = {
  '権利関係':    ['意思表示','代理','取得時効','抵当権','借地借家法','区分所有法','不動産登記法','賃貸借','物権変動','相続','担保物権','不法行為','契約総論'],
  '宅建業法':    ['免許制度','宅地建物取引士','営業保証金','媒介契約','重要事項説明','クーリングオフ','8種制限','37条書面','報酬','広告規制','業務規制','監督処分'],
  '法令上の制限':['都市計画法','開発許可','建築基準法・用途制限','建築基準法・高さ制限','建築基準法・集団規定','農地法','国土利用計画法','土地区画整理法','宅地造成等規制法'],
  '税・その他':  ['不動産取得税','固定資産税','印紙税','所得税・譲渡所得','地価公示','不動産鑑定評価','住宅金融支援機構','景品表示法','土地の知識','建物の知識'],
};

// ─── ゲーミフィケーション ─────────────────────────
const LEVELS = [
  { lv:1, title:'宅建見習い',   minXp:0,    emoji:'🌱', color:'#6b7280' },
  { lv:2, title:'宅建の卵',     minXp:150,  emoji:'🥚', color:'#0ea5e9' },
  { lv:3, title:'宅建初心者',   minXp:400,  emoji:'📖', color:'#8b5cf6' },
  { lv:4, title:'宅建学習者',   minXp:800,  emoji:'📚', color:'#f59e0b' },
  { lv:5, title:'宅建候補生',   minXp:1400, emoji:'🎯', color:'#f97316' },
  { lv:6, title:'宅建合格圏',   minXp:2200, emoji:'⭐', color:'#16a34a' },
  { lv:7, title:'宅建の達人',   minXp:3500, emoji:'🏆', color:'#dc2626' },
  { lv:8, title:'宅建マスター', minXp:5000, emoji:'👑', color:'#d97706' },
];
const BADGE_DEFS = [
  { id:'first_correct', emoji:'🏠', name:'第一歩',       desc:'初めて問題に正解した！' },
  { id:'streak3',       emoji:'🔥', name:'3連勝',        desc:'3問連続で正解！' },
  { id:'streak7',       emoji:'⚡', name:'7連勝',        desc:'7問連続で正解！' },
  { id:'streak10',      emoji:'💫', name:'10連勝',       desc:'10問連続で正解！すごい！' },
  { id:'total10',       emoji:'📝', name:'10問突破',     desc:'累計10問に回答した' },
  { id:'total50',       emoji:'💪', name:'50問突破',     desc:'累計50問に回答した！' },
  { id:'total100',      emoji:'🌟', name:'100問突破',    desc:'累計100問に回答！圧倒的！' },
  { id:'days3',         emoji:'📅', name:'3日継続',      desc:'3日連続で学習した！' },
  { id:'days7',         emoji:'🗓️', name:'1週間継続',   desc:'7日連続で学習！習慣化！' },
  { id:'accuracy80',    emoji:'🎯', name:'高精度',       desc:'正解率80%以上を達成！' },
  { id:'cat_kenri',     emoji:'⚖️', name:'権利関係制覇', desc:'権利関係を全問習得！' },
  { id:'cat_gyoho',     emoji:'🏢', name:'業法制覇',     desc:'宅建業法を全問習得！' },
  { id:'cat_horei',     emoji:'🗺️', name:'法令制覇',    desc:'法令上の制限を全問習得！' },
  { id:'cat_zei',       emoji:'💰', name:'税金博士',     desc:'税・その他を全問習得！' },
  { id:'lv8',           emoji:'👑', name:'宅建マスター', desc:'最高レベルに到達！' },
];
const CORRECT_MSGS = ['その調子！合格に一歩近づいた！💪','素晴らしい！知識が身についてる！','完璧！この問題はバッチリ！🎉','ナイス！この調子で続けよう！','正解！合格への道を歩んでる！'];
const WRONG_MSGS   = ['惜しい！ここが最高の学習チャンス！📖','大丈夫、次は絶対覚えてる！','繰り返しが力になる。諦めないで！','間違えた問題こそ宝！解説をしっかり読もう！','ここを乗り越えれば一段と強くなれる！'];
const SESSION_MSGS = ['合格への道は今日から！','1問1問が合格に近づく一歩！','今日の努力が本番で光る！','積み重ねが合格を引き寄せる！'];

function getLevelInfo(xp) {
  let cur=LEVELS[0], nxt=LEVELS[1];
  for(let i=LEVELS.length-1;i>=0;i--){ if(xp>=LEVELS[i].minXp){cur=LEVELS[i];nxt=LEVELS[i+1]||null;break;} }
  return {cur,nxt};
}
function calcXp(correct, streak) { return correct ? 10+Math.min(streak*2,20) : 2; }
function pick(arr) { return arr[Math.floor(Math.random()*arr.length)]; }

// ─── 忘却曲線 ──────────────────────────────────
const DEFAULT_EASE=2.5, MIN_EASE=1.3;
function todayStr() { return new Date().toISOString().split('T')[0]; }
function addDays(d,n) { const dt=new Date(d+'T00:00:00'); dt.setDate(dt.getDate()+n); return dt.toISOString().split('T')[0]; }
function calcNextReview(prev, correct) {
  let interval=prev?.interval||0, reps=prev?.repetitions||0, ease=prev?.easeFactor||DEFAULT_EASE;
  const total=(prev?.totalAttempts||0)+1, corrCt=(prev?.correctAttempts||0)+(correct?1:0);
  if(correct){if(reps===0)interval=1;else if(reps===1)interval=3;else interval=Math.round(interval*ease);reps++;ease=Math.min(3.0,ease+0.1);}
  else{interval=1;reps=0;ease=Math.max(MIN_EASE,ease-0.2);}
  return {interval,repetitions:reps,easeFactor:ease,nextReview:addDays(todayStr(),interval),lastReview:todayStr(),totalAttempts:total,correctAttempts:corrCt};
}

const LS={prog:'tk_prog',sess:'tk_sess',set:'tk_set',game:'tk_game'};
function ls(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch{return d;}}
function lsSet(k,v){localStorage.setItem(k,JSON.stringify(v));}

// ─── UI 部品 ─────────────────────────────────
function CatBadge({cat}) {
  const c=CAT_COLORS[cat]||CAT_COLORS['税・その他'];
  return <span className={`inline-block px-2 py-0.5 rounded-full text-xs font-medium ${c.bg} ${c.text}`}>{cat}</span>;
}
function ProgressRing({pct,size=56,stroke=5,color='#16a34a'}) {
  const r=(size-stroke)/2,circ=2*Math.PI*r,off=circ*(1-Math.min(100,pct)/100);
  return (<svg width={size} height={size}><circle cx={size/2} cy={size/2} r={r} fill="none" stroke="#e5e7eb" strokeWidth={stroke}/><circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={stroke} strokeDasharray={circ} strokeDashoffset={off} strokeLinecap="round" style={{transform:'rotate(-90deg)',transformOrigin:'center',transition:'stroke-dashoffset 0.6s ease'}}/></svg>);
}
function StarRating({pct}) {
  const stars=Math.round(pct/20);
  return <span className="text-yellow-400 text-sm">{'★'.repeat(stars)}{'☆'.repeat(5-stars)}</span>;
}
function LevelUpModal({level,onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,4000);return()=>clearTimeout(t);},[]);
  return (<div className="fixed inset-0 bg-black/60 flex items-center justify-center z-50 p-4" onClick={onClose}><div className="card p-8 text-center lv-anim max-w-xs w-full"><div className="text-6xl mb-2">{level.emoji}</div><div className="text-yellow-500 font-bold text-sm tracking-widest mb-1">LEVEL UP!</div><div className="text-3xl font-bold text-gray-800 mb-0.5">Lv.{level.lv}</div><div className="text-xl font-bold mb-4" style={{color:level.color}}>{level.title}</div><p className="text-sm text-gray-500">新しいレベルに到達しました！<br/>この調子で合格を目指そう 🎉</p><button onClick={onClose} className="mt-5 px-8 py-2.5 bg-green-600 text-white rounded-full text-sm font-bold">続ける！</button></div></div>);
}
function BadgeModal({badge,onClose}) {
  useEffect(()=>{const t=setTimeout(onClose,3000);return()=>clearTimeout(t);},[]);
  return (<div className="fixed inset-0 flex items-end justify-center z-50 p-4 pointer-events-none"><div className="card p-5 text-center pop-in max-w-xs w-full mb-6 pointer-events-auto" onClick={onClose}><div className="text-xs text-green-600 font-bold mb-1 tracking-wide">🏅 バッジ獲得！</div><div className="text-4xl mb-1">{badge.emoji}</div><div className="font-bold text-gray-800">{badge.name}</div><div className="text-xs text-gray-400 mt-0.5">{badge.desc}</div></div></div>);
}

// ─── CategorySelectView（分野別練習） ───────────────
function CategorySelectView({progress, onSelectCategory, onSelectSub, onBack}) {
  const [expanded, setExpanded] = useState(null);
  return (
    <div className="min-h-screen pb-8">
      <div style={{background:'linear-gradient(135deg,#1d4ed8,#1e3a8a)'}} className="text-white px-4 pt-10 pb-6">
        <div className="flex items-center gap-3 mb-1"><button onClick={onBack} className="text-white/80 text-lg">←</button><h2 className="font-bold text-lg">分野別練習</h2></div>
        <p className="text-blue-200 text-xs ml-8">苦手な分野を集中対策！</p>
      </div>
      <div className="px-4 pt-4 space-y-3">
        {CATEGORIES.map(cat => {
          const c = CAT_COLORS[cat];
          const qs = QUESTIONS.filter(q=>q.category===cat);
          const done = qs.filter(q=>progress[q.id]).length;
          const allC = qs.reduce((a,q)=>a+(progress[q.id]?.correctAttempts||0),0);
          const allT = qs.reduce((a,q)=>a+(progress[q.id]?.totalAttempts||0),0);
          const acc = allT>0?Math.round(allC/allT*100):0;
          const pct = qs.length>0?Math.round(done/qs.length*100):0;
          const isOpen = expanded === cat;
          const subs = CAT_SUBS[cat] || [];
          return (
            <div key={cat} className="card overflow-hidden">
              <button onClick={()=>{setExpanded(isOpen?null:cat);}} className="w-full p-4 text-left">
                <div className="flex items-center gap-3">
                  <span className="text-2xl">{c.icon}</span>
                  <div className="flex-1">
                    <div className="flex justify-between items-center mb-1">
                      <span className={`font-bold text-sm ${c.text}`}>{cat}</span>
                      <div className="flex items-center gap-2">
                        <StarRating pct={pct}/>
                        <span className="text-xs text-gray-400">{done}/{qs.length}</span>
                      </div>
                    </div>
                    <div className="h-1.5 bg-gray-100 rounded-full overflow-hidden">
                      <div className="h-full rounded-full" style={{width:`${pct}%`,background:c.dot,transition:'width 0.5s ease'}}/>
                    </div>
                    <div className="flex justify-between text-xs mt-1">
                      <span className="text-gray-400">正解率 {acc}%</span>
                      <span className={`font-medium ${c.text}`}>{isOpen?'▲':'▼'}</span>
                    </div>
                  </div>
                </div>
              </button>
              {/* カテゴリ全体で練習 */}
              {isOpen && (
                <div className="border-t border-gray-50 px-4 pb-4">
                  <button
                    onClick={()=>onSelectCategory(cat)}
                    className={`w-full py-3 rounded-xl font-bold text-sm text-white mb-3 mt-3 bg-gradient-to-r ${c.grad}`}>
                    {c.icon} {cat}全体を練習（{qs.length}問）
                  </button>
                  {/* サブカテゴリ */}
                  <p className="text-xs text-gray-400 mb-2 font-medium">テーマ別</p>
                  <div className="space-y-1.5">
                    {subs.map(sub => {
                      const subQs = QUESTIONS.filter(q=>q.category===cat&&q.sub===sub);
                      if(subQs.length===0) return null;
                      const subDone = subQs.filter(q=>progress[q.id]).length;
                      const subC = subQs.reduce((a,q)=>a+(progress[q.id]?.correctAttempts||0),0);
                      const subT = subQs.reduce((a,q)=>a+(progress[q.id]?.totalAttempts||0),0);
                      const subAcc = subT>0?Math.round(subC/subT*100):0;
                      const subPct = subQs.length>0?Math.round(subDone/subQs.length*100):0;
                      return (
                        <button key={sub} onClick={()=>onSelectSub(cat,sub)}
                          className={`w-full flex items-center justify-between p-3 rounded-xl border ${c.border} ${c.bg} active:opacity-70`}>
                          <div className="flex-1 text-left">
                            <div className="flex items-center justify-between">
                              <span className={`text-sm font-medium ${c.text}`}>{sub}</span>
                              <span className="text-xs text-gray-400">{subQs.length}問</span>
                            </div>
                            <div className="flex items-center gap-2 mt-1">
                              <div className="flex-1 h-1 bg-white/60 rounded-full overflow-hidden">
                                <div className="h-full rounded-full" style={{width:`${subPct}%`,background:c.dot}}/>
                              </div>
                              {subT>0 && <span className="text-xs text-gray-500">{subAcc}%</span>}
                            </div>
                          </div>
                          <span className="text-gray-400 ml-2">›</span>
                        </button>
                      );
                    })}
                  </div>
                </div>
              )}
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ─── HomeView ─────────────────────────────────
function HomeView({dueQ,newQ,progress,sessions,gameData,onStart,onCategoryPractice,onStats,onSettings}) {
  const {cur:curLv,nxt:nxtLv}=getLevelInfo(gameData.xp);
  const today=todayStr();
  const todayDone=sessions.filter(s=>s.date===today).reduce((a,s)=>a+s.questionsAnswered,0);
  const studied=Object.keys(progress).length;
  const mastered=Object.values(progress).filter(p=>p.repetitions>=4).length;
  const allC=Object.values(progress).reduce((a,p)=>a+(p.correctAttempts||0),0);
  const allT=Object.values(progress).reduce((a,p)=>a+(p.totalAttempts||0),0);
  const accuracy=allT>0?Math.round(allC/allT*100):0;
  const queueCount=dueQ.length+newQ.length;
  const sessionMsg=useMemo(()=>pick(SESSION_MSGS),[]);
  const streak=useMemo(()=>{
    if(!sessions.length)return 0;
    const dates=[...new Set(sessions.map(s=>s.date))].sort().reverse();
    let c=0,cur=todayStr();
    for(const d of dates){if(d===cur){c++;cur=addDays(cur,-1);}else if(d<cur)break;}
    return c;
  },[sessions]);
  const xpPct=nxtLv?Math.min(100,Math.round((gameData.xp-curLv.minXp)/(nxtLv.minXp-curLv.minXp)*100)):100;
  const last7=Array.from({length:7},(_,i)=>{const d=addDays(todayStr(),-6+i),ss=sessions.filter(s=>s.date===d);return{d,label:['日','月','火','水','木','金','土'][new Date(d+'T00:00:00').getDay()],count:ss.reduce((a,s)=>a+s.questionsAnswered,0)};});
  const maxBar=Math.max(...last7.map(d=>d.count),1);
  const catStats=CATEGORIES.map(cat=>{const qs=QUESTIONS.filter(q=>q.category===cat),done=qs.filter(q=>progress[q.id]).length;return{cat,total:qs.length,done,pct:qs.length>0?Math.round(done/qs.length*100):0};});

  return (
    <div className="min-h-screen pb-8">
      <div style={{background:'linear-gradient(135deg,#16a34a 0%,#14532d 100%)'}} className="text-white px-4 pt-12 pb-8">
        <div className="flex justify-between items-start mb-5">
          <div><h1 className="text-2xl font-bold tracking-tight">宅建マスター</h1><p className="text-green-300 text-xs mt-0.5">{sessionMsg}</p></div>
          <button onClick={onSettings} className="w-9 h-9 flex items-center justify-center rounded-full bg-white/15">⚙️</button>
        </div>
        <div className="bg-white/12 rounded-2xl p-4 mb-4">
          <div className="flex items-center gap-3 mb-3">
            <span className="text-3xl">{curLv.emoji}</span>
            <div className="flex-1">
              <div className="flex items-center gap-2 flex-wrap">
                <span className="font-bold">Lv.{curLv.lv} {curLv.title}</span>
                {streak>0&&<span className="text-xs bg-orange-500/80 px-2 py-0.5 rounded-full">🔥 {streak}日連続</span>}
              </div>
              <p className="text-green-300 text-xs">{gameData.xp} XP{nxtLv?` · あと ${nxtLv.minXp-gameData.xp} XP`:' (MAX!)'}</p>
            </div>
          </div>
          <div className="h-2.5 bg-white/20 rounded-full overflow-hidden"><div className="h-full bg-white rounded-full progress-bar shine" style={{width:`${xpPct}%`}}/></div>
          {nxtLv&&<p className="text-right text-xs text-green-300 mt-0.5">次: {nxtLv.emoji} {nxtLv.title}</p>}
        </div>
        <div className="grid grid-cols-3 gap-2">
          {[{val:dueQ.length,label:'復習',sub:'忘却曲線'},{val:newQ.length,label:'新規',sub:'今日の分'},{val:todayDone,label:'完了',sub:'今日'}].map(({val,label,sub})=>(
            <div key={label} className="bg-white/12 rounded-xl p-3 text-center"><div className="text-2xl font-bold">{val}</div><div className="text-green-200 text-xs font-medium">{label}</div><div className="text-green-400 text-xs">{sub}</div></div>
          ))}
        </div>
      </div>

      <div className="px-4 -mt-3">
        {/* 学習開始・分野別 */}
        <div className="card p-4 mb-4 slide-up">
          <button onClick={onStart} disabled={queueCount===0}
            className={`w-full py-4 rounded-xl font-bold text-base mb-3 transition-all ${queueCount>0?'bg-green-600 text-white shadow-lg shadow-green-200 active:bg-green-700':'bg-gray-100 text-gray-400'}`}>
            {queueCount>0?`🚀 今日の学習（${queueCount}問）`:'🎉 今日の問題は全部完了！'}
          </button>
          <button onClick={onCategoryPractice}
            className="w-full py-3.5 rounded-xl font-bold text-sm bg-blue-600 text-white shadow-md shadow-blue-200 active:bg-blue-700">
            📚 分野別練習（{QUESTIONS.length}問）
          </button>
        </div>

        {/* バッジ */}
        {gameData.badges.length>0&&(
          <div className="card p-4 mb-4 fade-in">

// ─── StudyView ────────────────────────────────
function StudyView({question,qNum,qTotal,showResult,selected,streak,xpGain,mode,modeLabel,onAnswer,onNext,onExit}) {
  const [showXp,setShowXp]=useState(false);
  useEffect(()=>{if(xpGain>0){setShowXp(true);const t=setTimeout(()=>setShowXp(false),900);return()=>clearTimeout(t);}},[xpGain]);
  const correct=question.ans;
  const msg=showResult?(selected===correct?pick(CORRECT_MSGS):pick(WRONG_MSGS)):'';
  return (
    <div className="min-h-screen flex flex-col bg-gray-50">
      <div className="bg-white px-4 pt-10 pb-3 shadow-sm">
        <div className="flex items-center gap-3">
          <button onClick={onExit} className="text-gray-400 text-lg leading-none">←</button>
          <div className="flex-1">
            <div className="flex justify-between text-xs text-gray-400 mb-1">
              <span className="font-medium">{qNum} / {qTotal}{modeLabel&&<span className="ml-1 text-blue-500">· {modeLabel}</span>}</span>
              {streak>=3&&<span className="text-orange-500 font-bold">🔥 {streak}連勝中！</span>}
            </div>
            <div className="h-2 bg-gray-100 rounded-full overflow-hidden"><div className="h-full bg-green-500 rounded-full progress-bar" style={{width:`${qNum/qTotal*100}%`}}/></div>
          </div>
        </div>
      </div>
      <div className="flex-1 overflow-y-auto px-4 py-4">
        <div className="card p-4 mb-4 fade-in">
          <div className="flex gap-2 mb-2 flex-wrap">
            <CatBadge cat={question.category}/>
            <span className="text-xs text-gray-400 self-center">{question.sub}</span>
            {question.year&&<span className="text-xs bg-gray-100 text-gray-500 px-2 py-0.5 rounded-full self-center">{question.year}年</span>}
          </div>
          <p className="text-sm text-gray-800 leading-relaxed font-medium">{question.q}</p>
        </div>
        <div className="space-y-2 relative">
          {question.opts.map((opt,i)=>{
            let cls='btn-opt w-full text-left p-4 rounded-xl border-2 text-sm leading-snug ';
            if(!showResult)cls+='bg-white border-gray-200 text-gray-700 active:border-green-400 active:bg-green-50';
            else if(i===correct)cls+='bg-green-50 border-green-400 text-green-800';
            else if(i===selected&&selected!==correct)cls+='bg-red-50 border-red-300 text-red-700';
            else cls+='bg-white border-gray-100 text-gray-300';
            return(<button key={i} onClick={()=>!showResult&&onAnswer(i)} className={cls}><span className="font-bold mr-2">{showResult&&i===correct?'✓':showResult&&i===selected&&selected!==correct?'✗':`${i+1}.`}</span>{opt}</button>);
          })}
          {showXp&&<div className="xp-fly"><span className="text-green-600 font-bold text-xl">+{xpGain} XP</span></div>}
        </div>
        {showResult&&(
          <div className="mt-4 card p-4 slide-up">
            <div className="flex items-start gap-3 mb-3">
              <span className="text-2xl">{selected===correct?'🎉':'📖'}</span>
              <div><div className={`font-bold text-sm ${selected===correct?'text-green-700':'text-red-600'}`}>{selected===correct?'正解！':'不正解'}</div><div className={`text-xs mt-0.5 ${selected===correct?'text-green-600':'text-orange-600'}`}>{msg}</div></div>
            </div>
            <div className="bg-gray-50 rounded-xl p-3"><p className="text-xs text-gray-600 leading-relaxed">{question.exp}</p></div>
          </div>
        )}
        <div className="h-24"/>
      </div>
      {showResult&&(
        <div className="fixed bottom-0 left-0 right-0 px-4 pb-8 pt-3 bg-gradient-to-t from-gray-50 to-transparent">
          <button onClick={onNext} className="w-full py-4 bg-green-600 text-white rounded-xl font-bold text-base shadow-lg shadow-green-200 active:bg-green-700">次の問題へ →</button>
        </div>
      )}
    </div>
  );
}

// ─── StatsView ────────────────────────────────
function StatsView({progress,sessions,gameData,onBack}) {
  const studied=Object.keys(progress).length,mastered=Object.values(progress).filter(p=>p.repetitions>=4).length;

  const allT=Object.values(progress).reduce((a,p)=>a+(p.totalAttempts||0),0);
  const accuracy=allT>0?Math.round(allC/allT*100):0;
  const totalTime=sessions.reduce((a,s)=>a+(s.timeSpent||0),0);
  const fmtTime=s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);return h>0?`${h}時間${m}分`:`${m}分`;};
  const {cur:curLv}=getLevelInfo(gameData.xp);
  const last30=Array.from({length:30},(_,i)=>{const d=addDays(todayStr(),-29+i),ss=sessions.filter(s=>s.date===d);return{d,count:ss.reduce((a,s)=>a+s.questionsAnswered,0)};});
  const maxD=Math.max(...last30.map(d=>d.count),1);
  const catDetail=CATEGORIES.map(cat=>{const qs=QUESTIONS.filter(q=>q.category===cat),done=qs.filter(q=>progress[q.id]);const c=done.reduce((a,q)=>a+(progress[q.id]?.correctAttempts||0),0),t=done.reduce((a,q)=>a+(progress[q.id]?.totalAttempts||0),0);return{cat,total:qs.length,done:done.length,accuracy:t>0?Math.round(c/t*100):0,pct:qs.length>0?Math.round(done.length/qs.length*100):0};});
  return (
    <div className="min-h-screen pb-8">
      <div style={{background:'linear-gradient(135deg,#16a34a,#14532d)'}} className="text-white px-4 pt-10 pb-5">
        <div className="flex items-center gap-3"><button onClick={onBack} className="text-white/80 text-lg">←</button><h2 className="font-bold text-lg">学習統計</h2></div>
      </div>
      <div className="px-4 pt-4 space-y-4">
        <div className="card p-4 fade-in">
          <div className="flex items-center gap-3 mb-3"><span className="text-4xl">{curLv.emoji}</span><div><div className="font-bold text-gray-800">Lv.{curLv.lv} {curLv.title}</div><div className="text-sm text-gray-500">{gameData.xp} XP 獲得</div></div></div>
          <div className="grid grid-cols-2 gap-3">
            <div className="bg-yellow-50 rounded-xl p-3 text-center"><div className="text-xl font-bold text-yellow-600">{gameData.xp}</div><div className="text-xs text-gray-500">総XP</div></div>
            <div className="bg-purple-50 rounded-xl p-3 text-center"><div className="text-xl font-bold text-purple-600">{gameData.badges.length}</div><div className="text-xs text-gray-500">バッジ数</div></div>
          </div>
        </div>
        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-3">総合成績</h3>
          <div className="grid grid-cols-2 gap-3">
            {[{label:'学習問題',val:`${studied}/${QUESTIONS.length}問`,sub:`${Math.round(studied/QUESTIONS.length*100)}%完了`},{label:'習得済み',val:`${mastered}問`,sub:'4回以上正解'},{label:'全体正解率',val:`${accuracy}%`,sub:`${allT}回解答`},{label:'累計学習時間',val:fmtTime(totalTime),sub:`${sessions.length}セッション`}].map(({label,val,sub})=>(<div key={label} className="bg-gray-50 rounded-xl p-3"><div className="text-xs text-gray-400 mb-0.5">{label}</div><div className="text-lg font-bold text-gray-700">{val}</div><div className="text-xs text-gray-400">{sub}</div></div>))}
          </div>
        </div>
        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-3">学習カレンダー（30日）</h3>
          <div className="grid grid-cols-10 gap-1">{last30.map(({d,count})=>(<div key={d} title={`${d}: ${count}問`} className="aspect-square rounded" style={{background:count===0?'#e5e7eb':count<maxD*0.3?'#bbf7d0':count<maxD*0.7?'#4ade80':'#16a34a'}}/>))}</div>
          <div className="flex items-center gap-1 mt-2 justify-end"><span className="text-xs text-gray-400">少</span>{['#e5e7eb','#bbf7d0','#4ade80','#16a34a'].map(c=><div key={c} className="w-3 h-3 rounded" style={{background:c}}/>)}<span className="text-xs text-gray-400">多</span></div>

        <div className="card p-4 fade-in">
          <h3 className="font-bold text-gray-800 mb-3">🏅 バッジコレクション</h3>

        </div>
      </div>
    </div>
  );
}

  const [queue,setQueue]=useState([]);
  const [qIdx,setQIdx]=useState(0);
  const [results,setResults]=useState([]);
  const [showResult,setShowResult]=useState(false);
  const [selected,setSelected]=useState(null);
  const [sessStart,setSessStart]=useState(null);
  const [currentStreak,setCurrentStreak]=useState(0);
  const [xpGain,setXpGain]=useState(0);
  const [sessXp,setSessXp]=useState(0);
  const [levelUpData,setLevelUpData]=useState(null);
  const [newBadges,setNewBadges]=useState([]);
  const [showBadge,setShowBadge]=useState(null);
  const [pendingBadges,setPendingBadges]=useState([]);
  const [studyMode,setStudyMode]=useState(null); // null=通常 | {type:'category'|'sub', cat, sub?}
  const [modeLabel,setModeLabel]=useState('');
  const [retryQueue,setRetryQueue]=useState(null);

  useEffect(()=>{if(pendingBadges.length>0&&!showBadge){setShowBadge(pendingBadges[0]);setPendingBadges(p=>p.slice(1));}},[pendingBadges,showBadge]);

  const dueQ=useMemo(()=>QUESTIONS.filter(q=>progress[q.id]?.nextReview<=todayStr()&&settings.categories.includes(q.category)),[progress,settings.categories]);
  const newQ=useMemo(()=>QUESTIONS.filter(q=>!progress[q.id]&&settings.categories.includes(q.category)).slice(0,settings.newPerDay),[progress,settings.categories,settings.newPerDay]);

  const checkBadges=useCallback((newProg,xp,streak,streak7d)=>{
    const prev=[...gameData.badges],add=[];
    const allC=Object.values(newProg).reduce((a,p)=>a+(p.correctAttempts||0),0);
    const allT=Object.values(newProg).reduce((a,p)=>a+(p.totalAttempts||0),0);
    const acc=allT>0?Math.round(allC/allT*100):0;
    const chk=id=>{if(!prev.includes(id)){prev.push(id);add.push(id);}};
    if(allC>=1)chk('first_correct');if(streak>=3)chk('streak3');if(streak>=7)chk('streak7');if(streak>=10)chk('streak10');
    if(allT>=10)chk('total10');if(allT>=50)chk('total50');if(allT>=100)chk('total100');
    if(streak7d>=3)chk('days3');if(streak7d>=7)chk('days7');
    if(acc>=80&&allT>=10)chk('accuracy80');
    const cats={'権利関係':'cat_kenri','宅建業法':'cat_gyoho','法令上の制限':'cat_horei','税・その他':'cat_zei'};
    for(const[cat,id]of Object.entries(cats)){if(QUESTIONS.filter(q=>q.category===cat).every(q=>newProg[q.id]?.repetitions>=4))chk(id);}
    if(xp>=5000)chk('lv8');
    return{badges:prev,newBadges:add};
  },[gameData.badges]);

  const launchStudy=(qs,label,mode)=>{
    if(!qs.length)return;
    const shuffled=[...qs].sort(()=>Math.random()-0.5);
    setQueue(shuffled);setQIdx(0);setResults([]);setShowResult(false);setSelected(null);
    setSessStart(Date.now());setCurrentStreak(0);setSessXp(0);setNewBadges([]);
    setStudyMode(mode||null);setModeLabel(label||'');setRetryQueue(qs);
    setView('study');
  };
  const startNormal=()=>launchStudy([...dueQ,...newQ],'','normal');
  const startCategory=(cat)=>launchStudy(QUESTIONS.filter(q=>q.category===cat),cat,{type:'category',cat});
  const startSub=(cat,sub)=>launchStudy(QUESTIONS.filter(q=>q.category===cat&&q.sub===sub),`${cat} › ${sub}`,{type:'sub',cat,sub});
  const handleRetry=()=>{if(retryQueue)launchStudy(retryQueue,modeLabel,studyMode);};

  const handleAnswer=optIdx=>{
    if(showResult)return;
    setSelected(optIdx);setShowResult(true);
    const q=queue[qIdx],correct=optIdx===q.ans;
    const newStreak=correct?currentStreak+1:0;
    setCurrentStreak(newStreak);
    const xp=calcXp(correct,newStreak);
    setXpGain(xp);
    const newProg={...progress,[q.id]:calcNextReview(progress[q.id],correct)};
    setProgress(newProg);lsSet(LS.prog,newProg);
    const newXp=gameData.xp+xp;
    const oldLv=getLevelInfo(gameData.xp).cur,newLvInfo=getLevelInfo(newXp).cur;
    const streak7d=(()=>{const dates=[...new Set(sessions.map(s=>s.date))].sort().reverse();let c=0,cur=todayStr();for(const d of dates){if(d===cur){c++;cur=addDays(cur,-1);}else if(d<cur)break;}return c+1;})();
    const{badges,newBadges:nb}=checkBadges(newProg,newXp,newStreak,streak7d);
    const fg={...gameData,xp:newXp,badges};
    setGameData(fg);lsSet(LS.game,fg);
    setSessXp(p=>p+xp);
    if(newLvInfo.lv>oldLv.lv)setLevelUpData(newLvInfo);
    if(nb.length>0){setNewBadges(p=>[...p,...nb]);setPendingBadges(p=>[...p,...nb]);}
    setResults(p=>[...p,{questionId:q.id,correct}]);
  };

  const handleNext=()=>{
    if(qIdx+1>=queue.length){
      const time=Math.round((Date.now()-sessStart)/1000);
      const updSess=[...sessions,{date:todayStr(),questionsAnswered:queue.length,correctAnswers:results.filter(r=>r.correct).length,timeSpent:time,mode:studyMode?.type||'normal'}];
      setSessions(updSess);lsSet(LS.sess,updSess);
      setView('complete');
    }else{setQIdx(p=>p+1);setShowResult(false);setSelected(null);setXpGain(0);}
  };

  const updateSettings=upd=>{const s={...settings,...upd};setSettings(s);lsSet(LS.set,s);};
  const handleReset=()=>{if(confirm('すべての学習データをリセットしますか？この操作は取り消せません。')){setProgress({});setSessions([]);setGameData({xp:0,badges:[]});lsSet(LS.prog,{});lsSet(LS.sess,[]);lsSet(LS.game,{xp:0,badges:[]});setView('home');}};

  return (
    <div className="max-w-md mx-auto min-h-screen bg-gray-50 relative overflow-x-hidden">
      {view==='home'&&<HomeView dueQ={dueQ} newQ={newQ} progress={progress} sessions={sessions} gameData={gameData} onStart={startNormal} onCategoryPractice={()=>setView('catselect')} onStats={()=>setView('stats')} onSettings={()=>setView('settings')}/>}
      {view==='catselect'&&<CategorySelectView progress={progress} onSelectCategory={startCategory} onSelectSub={startSub} onBack={()=>setView('home')}/>}
      {view==='study'&&queue.length>0&&<StudyView question={queue[qIdx]} qNum={qIdx+1} qTotal={queue.length} showResult={showResult} selected={selected} streak={currentStreak} xpGain={xpGain} modeLabel={modeLabel} onAnswer={handleAnswer} onNext={handleNext} onExit={()=>setView('home')}/>}
      {view==='complete'&&<CompleteView results={results} questions={queue} xpEarned={sessXp} newBadges={newBadges} modeLabel={modeLabel} onHome={()=>setView('home')} onRetry={handleRetry}/>}
      {view==='stats'&&<StatsView progress={progress} sessions={sessions} gameData={gameData} onBack={()=>setView('home')}/>}
      {view==='settings'&&<SettingsView settings={settings} onUpdate={updateSettings} onBack={()=>setView('home')} onReset={handleReset}/>}
      {levelUpData&&<LevelUpModal level={levelUpData} onClose={()=>setLevelUpData(null)}/>}
      {showBadge&&<BadgeModal badge={BADGE_DEFS.find(b=>b.id===showBadge)} onClose={()=>setShowBadge(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
